<div class="aero-stage">
  <div class="aero-frame">
    <main class="aero-body">
      <div class="login-wrap">
        <h1>Set a new password</h1>
        @if (!ready()) {
          <p class="aero-sub">Checking your reset link…</p>
        } @else if (invalidLink()) {
          <p class="aero-sub">
            This reset link is invalid or has expired.
          </p>
          <p class="aero-register-link">
            <a routerLink="/login">Back to sign in</a>
          </p>
        } @else {
          <p class="aero-sub">Choose a password of at least 6 characters.</p>
          <form (ngSubmit)="onSubmit()" class="aero-login-form">
            <label>
              New password
              <span class="pwd-row">
                <input
                  class="aero-input"
                  [type]="hidePassword() ? 'password' : 'text'"
                  name="password"
                  autocomplete="new-password"
                  [(ngModel)]="model.password"
                />
                <button
                  class="gloss-btn"
                  type="button"
                  (click)="togglePasswordVisibility($event)"
                  tabindex="-1"
                >
                  {{ hidePassword() ? 'Show' : 'Hide' }}
                </button>
              </span>
              @if (showPasswordRequired()) {
                <span class="aero-field-error">Password is required</span>
              }
              @if (showPasswordMin()) {
                <span class="aero-field-error">At least 6 characters</span>
              }
            </label>

            <label>
              Confirm new password
              <input
                class="aero-input"
                [type]="hidePassword() ? 'password' : 'text'"
                name="confirm"
                autocomplete="new-password"
                [(ngModel)]="model.confirm"
              />
              @if (showPasswordMismatch()) {
                <span class="aero-field-error">
                  New password and confirmation do not match
                </span>
              }
            </label>

            <button
              class="gloss-btn primary wide"
              type="submit"
              [disabled]="isLoading()"
            >
              {{ isLoading() ? 'Saving...' : 'Update password' }}
            </button>
          </form>
        }
      </div>
    </main>
  </div>
</div>
