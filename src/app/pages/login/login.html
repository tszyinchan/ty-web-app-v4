<div class="aero-stage">
  <div class="aero-frame">
    <main class="aero-body">
      <div class="login-wrap">
        <h1>{{ titlePrefix() }} {{ appName() }}</h1>
        <p class="aero-sub">{{ subtitle() }}</p>

        <form
          [formGroup]="loginForm"
          (ngSubmit)="onSubmit()"
          class="aero-login-form"
        >
          <label>
            {{ emailLabel() }}
            <input
              class="aero-input"
              type="email"
              formControlName="email"
              autocomplete="username"
            />
            @if (showEmailRequired()) {
              <span class="aero-field-error">{{ emailReqErr() }}</span>
            }
            @if (showEmailInvalid()) {
              <span class="aero-field-error">{{ emailInvErr() }}</span>
            }
          </label>

          <label>
            {{ pwdLabel() }}
            <span class="pwd-row">
              <input
                class="aero-input"
                [type]="hidePassword() ? 'password' : 'text'"
                formControlName="password"
                autocomplete="current-password"
              />
              <button
                class="gloss-btn"
                type="button"
                (click)="togglePasswordVisibility($event)"
                tabindex="-1"
              >
                {{ hidePassword() ? revealPwdBtn() : concealPwdBtn() }}
              </button>
            </span>
            @if (showPasswordRequired()) {
              <span class="aero-field-error">{{ pwdReqErr() }}</span>
            }
            @if (showPasswordMin()) {
              <span class="aero-field-error">{{ pwdMinErr() }}</span>
            }
          </label>

          <button
            class="gloss-btn primary wide"
            type="submit"
            [disabled]="loginForm.invalid || isLoading()"
          >
            {{ isLoading() ? signingInBtn() : signInBtn() }}
          </button>
        </form>
      </div>
    </main>
  </div>
</div>
