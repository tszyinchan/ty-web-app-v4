@for (hold of holds(); track hold.key) {
  @let place = placeOf(hold);
  <div
    class="title-hold"
    [class.is-on]="hold.phase === 'on'"
    [style.--cg-cue-ms]="cueMs()"
  >
    @if (hold.backgroundUrl) {
      <app-cg-logo
        [imageUrl]="hold.backgroundUrl"
        [layout]="hold.backgroundLayout"
        [outline]="outline()"
      />
    }
    @for (element of place.elements; track element.field) {
      <div
        class="title-el"
        [class.outline]="outline()"
        [class.is-center]="element.align === 'center'"
        [class.is-right]="element.align === 'right'"
        [ngStyle]="elementCss(element)"
        [style.--cg-title-fit]="element.fit"
      >
        <span class="title-run" [ngStyle]="paintCss(element.styleKey)">
          <span class="title-stroke" aria-hidden="true">
            @for (part of parts(element.text); track $index) {
              <span [class.latin]="part.latin">{{ part.text }}</span>
            }
          </span>
          <span class="title-fill" [class.is-gradient]="gradientOn(element.styleKey)">
            @for (part of parts(element.text); track $index) {
              <span [class.latin]="part.latin">{{ part.text }}</span>
            }
          </span>
        </span>
      </div>
    }
  </div>
}
