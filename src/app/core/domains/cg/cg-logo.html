@if (imageUrl()) {
  <div
    class="logo-box"
    [class.natural]="!hasFixedWidth()"
    [class.off]="!visible()"
    [class.outline]="outline()"
    [ngStyle]="css()"
  >
    <img
      [src]="imageUrl()"
      [style.width]="imgWidth()"
      (load)="onImageLoad($event)"
      alt=""
    />
  </div>
}
