@if (label()) {
  <div class="cg-monitor-head">
    <span class="cg-kicker">{{ label() }}</span>
  </div>
}
<app-cg-stage [preview]="preview()" [backdrop]="backdrop()">
  @for (layer of stagedLayers(); track layer.tb_tyapp_cgly_id) {
    <app-cg-layer-view
      [elementType]="layer.element_type"
      [layout]="layer.layout"
      [payload]="layer.payload"
      [visible]="layer.visible"
      [durationMs]="durationMs()"
      [sortOrder]="layer.sort_order"
      [mono]="layerIsMono(layer.look, look())"
    />
  }
</app-cg-stage>
