<div class="public-calendar-page">
  <div class="calendar-toolbar">
    <h1 class="calendar-title">{{ viewDate() | date: "MMMM yyyy" }}</h1>

    <div class="calendar-toolbar-actions">
      <button mat-icon-button (click)="previous()" aria-label="Previous Month">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button mat-stroked-button (click)="goToToday()">Today</button>
      <button mat-icon-button (click)="next()" aria-label="Next Month">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button
        mat-icon-button
        (click)="washLogService.fetchAllLogs(true)"
        [disabled]="washLogService.loading()"
        aria-label="Refresh"
      >
        <mat-icon>refresh</mat-icon>
      </button>
    </div>
  </div>

  @if (washLogService.loading()) {
    <div class="calendar-loading">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  }

  <div class="calendar-body">
    <mwl-calendar-month-view
      [viewDate]="viewDate()"
      [events]="calendarEventsVM()"
      [cellTemplate]="customCellTemplate"
      [headerTemplate]="customHeaderTemplate"
    ></mwl-calendar-month-view>

    <ng-template #customHeaderTemplate let-days="days">
      <div class="cal-custom-header">
        @for (day of days; track day.day) {
          <div class="cal-header-cell">
            {{ day.date | date: dayFormat() }}
          </div>
        }
      </div>
    </ng-template>

    <ng-template #customCellTemplate let-day="day">
      <div class="cal-custom-cell">
        <div class="cell-date-wrapper">
          <span
            class="cell-date"
            [class.is-today]="day.isToday"
            [class.is-out-of-month]="!day.inMonth"
          >
            {{ day.date | date: "d" }}
          </span>
        </div>

        <div class="cell-events-wrapper">
          @for (event of day.events; track $index) {
            <div class="event-badge">{{ event.title }}</div>
          }
        </div>
      </div>
    </ng-template>
  </div>
</div>
