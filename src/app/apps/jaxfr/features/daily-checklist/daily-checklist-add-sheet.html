<div class="sheet-backdrop" (click)="cancel()"></div>
<div class="sheet" (click)="$event.stopPropagation()">
  <h2 class="sheet-title">New item</h2>
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="grow">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="itemText" name="sheet_item_text" />
  </mat-form-field>
  <div class="emoji-pick-row">
    <button type="button" class="emoji-trigger" (click)="openEmojiPicker()">
      {{ emoji || 'Add emoji' }}
    </button>
    @if (emoji) {
      <button type="button" class="doodle-link" (click)="clearEmoji()">Clear</button>
    }
  </div>
  <div class="colour-row">
    @for (preset of colourPresets; track preset.key) {
      <button
        type="button"
        class="colour-chip"
        [ngClass]="colourChipClasses(preset.key, colour === preset.key)"
        [attr.aria-label]="preset.label"
        (click)="selectColour(preset.key)"
      ></button>
    }
  </div>
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="grow">
    <mat-label>Remarks</mat-label>
    <input matInput [(ngModel)]="remarks" name="sheet_item_remarks" />
  </mat-form-field>
  <div class="sheet-actions">
    <button
      type="button"
      class="sheet-save"
      [disabled]="busy() || !itemText.trim()"
      (click)="confirm()"
    >
      Add
    </button>
    <button type="button" class="sheet-ghost" (click)="cancel()">Cancel</button>
  </div>
</div>

@if (showEmojiPicker()) {
  <div class="emoji-picker-backdrop" (click)="closeEmojiPicker()"></div>
  <div class="emoji-picker-panel">
    <emoji-picker (emoji-click)="onPickerEmoji($event)"></emoji-picker>
  </div>
}
