<div class="split-workspace">
  <div class="form-scroll-area">
    <section class="form-group appearance-section">
      <div class="section-heading">
        <h3 class="group-header">Appearance</h3>
        <p class="save-status" aria-live="polite">
          @if (prefs.saving()) {
            Saving…
          } @else if (prefs.loading()) {
            Loading…
          }
        </p>
      </div>

      <fieldset class="pref-fieldset">
        <legend>Visual style</legend>
        <div class="pref-options" role="radiogroup" aria-label="Visual style">
          @for (opt of visualThemeOptions; track opt.value) {
            <label class="pref-option" [class.selected]="prefs.visualTheme() === opt.value">
              <input
                type="radio"
                name="visualTheme"
                [value]="opt.value"
                [checked]="prefs.visualTheme() === opt.value"
                (change)="onVisualTheme(opt.value)"
              />
              <span class="pref-option-body">
                <span class="pref-option-title">{{ opt.label }}</span>
                <span class="pref-option-desc">{{ opt.description }}</span>
              </span>
            </label>
          }
        </div>
      </fieldset>

      <fieldset class="pref-fieldset">
        <legend>Color mode</legend>
        <div class="pref-options" role="radiogroup" aria-label="Color mode">
          @for (opt of colorModeOptions; track opt.value) {
            <label class="pref-option" [class.selected]="prefs.colorMode() === opt.value">
              <input
                type="radio"
                name="colorMode"
                [value]="opt.value"
                [checked]="prefs.colorMode() === opt.value"
                (change)="onColorMode(opt.value)"
              />
              <span class="pref-option-body">
                <span class="pref-option-title">{{ opt.label }}</span>
                <span class="pref-option-desc">{{ opt.description }}</span>
              </span>
            </label>
          }
        </div>
      </fieldset>

      <fieldset class="pref-fieldset">
        <legend>Welcome launcher</legend>
        <div class="pref-options" role="radiogroup" aria-label="Welcome launcher">
          @for (opt of launcherOptions; track opt.value) {
            <label
              class="pref-option"
              [class.selected]="prefs.welcomeLauncherMode() === opt.value"
            >
              <input
                type="radio"
                name="welcomeLauncher"
                [value]="opt.value"
                [checked]="prefs.welcomeLauncherMode() === opt.value"
                (change)="onLauncherMode(opt.value)"
              />
              <span class="pref-option-body">
                <span class="pref-option-title">{{ opt.label }}</span>
                <span class="pref-option-desc">{{ opt.description }}</span>
              </span>
            </label>
          }
        </div>
      </fieldset>
    </section>

    <section class="form-group">
      <h3 class="group-header">Notifications</h3>
      <app-notification-settings />
    </section>
  </div>
</div>
