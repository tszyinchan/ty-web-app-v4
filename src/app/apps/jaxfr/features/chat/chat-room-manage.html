<div class="split-workspace">
  @if (room(); as room) {
    <div class="form-scroll-area">
      <section class="form-group">
        <h3 class="group-header">Room Name</h3>

        <mat-form-field
          appearance="outline"
          class="full-width"
          subscriptSizing="dynamic"
        >
          <mat-label>Room name</mat-label>
          <input matInput [(ngModel)]="name" required />
        </mat-form-field>
      </section>

      <section class="form-group">
        <h3 class="group-header">Description</h3>

        <mat-form-field
          appearance="outline"
          class="full-width"
          subscriptSizing="dynamic"
        >
          <mat-label>Description (optional)</mat-label>
          <textarea
            matInput
            rows="4"
            [(ngModel)]="description"
            [maxlength]="descriptionMax"
            placeholder="What is this room for?"
          ></textarea>
          <mat-hint align="end"
            >{{ description.trim().length }} / {{ descriptionMax }}</mat-hint
          >
        </mat-form-field>
      </section>

      @if (isCreator()) {
        <section class="form-group">
          <h3 class="group-header">Members</h3>
          <button mat-stroked-button type="button" (click)="goToMembers()">
            <mat-icon>group</mat-icon>
            Manage Members
          </button>
        </section>

        <section class="form-group">
          <h3 class="group-header">Danger Zone</h3>
          <p class="danger-hint">
            Deleting the room removes it for every member. This cannot be
            undone.
          </p>
          <button
            mat-stroked-button
            type="button"
            color="warn"
            [disabled]="isLoading()"
            (click)="onDeleteRoom()"
          >
            <mat-icon>delete_outline</mat-icon>
            Delete Room
          </button>
        </section>
      }
    </div>
  }
</div>
