<div class="feed-container">
  @if (loading()) {
    <div class="feed-loading">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  } @else {
    @for (item of threadItems(); track item.id) {
      <mat-card class="feed-card">
        <mat-card-header class="custom-header">
          <div class="feed-card-header-row">
            <div class="article-title">{{ item.title }}</div>

            <div class="feed-card-actions">
              <button
                mat-icon-button
                class="feed-card-action"
                (click)="copyText(item.text)"
              >
                <mat-icon>content_copy</mat-icon>
              </button>
              <button
                mat-icon-button
                class="feed-card-action"
                (click)="onEdit(item.id)"
              >
                <mat-icon>edit</mat-icon>
              </button>
            </div>
          </div>

          <div class="article-meta">
            {{ item.sessionDate }}
            @if (item.status === RecordStatus.Inactive) {
              <span class="inactive-tag">· Inactive</span>
            }
          </div>
        </mat-card-header>

        <mat-card-content class="custom-content">
          <div class="article-body">{{ item.text }}</div>
        </mat-card-content>
      </mat-card>
    } @empty {
      <div class="feed-empty-placeholder">
        No fit sessions found.
      </div>
    }
  }
</div>
