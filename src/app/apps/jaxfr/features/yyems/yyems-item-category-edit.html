<div class="split-workspace">
  @if (item(); as cat) {
    <div class="form-scroll-area">
      <section class="form-group">
        <h3 class="group-header">Product category</h3>
        <div class="fields-grid-2">
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Code</mat-label>
            <input matInput [(ngModel)]="cat.code" required />
          </mat-form-field>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Sort order</mat-label>
            <input matInput type="number" [(ngModel)]="cat.sort_order" />
          </mat-form-field>
        </div>
        <div class="fields-grid-2 mt-16">
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Name (zh)</mat-label>
            <input matInput [(ngModel)]="cat.name_zh" required />
          </mat-form-field>
          <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Name (en)</mat-label>
            <input matInput [(ngModel)]="cat.name_en" />
          </mat-form-field>
        </div>
        <mat-form-field appearance="outline" class="full-width mt-16" subscriptSizing="dynamic">
          <mat-label>Division</mat-label>
          <input matInput [(ngModel)]="cat.division" />
        </mat-form-field>
      </section>
    </div>
  }
</div>
