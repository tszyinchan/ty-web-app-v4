<div class="cg-list">
  <label class="cg-search">
    <mat-icon>search</mat-icon>
    <input
      type="search"
      [(ngModel)]="searchQuery"
      placeholder="Search packages"
    />
  </label>

  <div class="cg-list-grid">
    @for (item of listVm(); track item.tb_tyapp_cgpk_id) {
      <a class="cg-pkg-card" [routerLink]="['../edit', item.tb_tyapp_cgpk_id]">
        <div class="cg-pkg-card-top">
          <span class="cg-pkg-name">{{ item.name }}</span>
          <span class="cg-role" [class.source]="item.role === Source">
            {{ item.roleLabel }}
          </span>
        </div>
        <p class="cg-pkg-layers">{{ item.layerSummary }}</p>
      </a>
    } @empty {
      @if (!cg.loading()) {
        <p class="cg-empty">
          No packages yet. Make CH36, News SNG, or any other package — they
          pick Elements from the same catalog.
        </p>
      }
    }
  </div>
</div>
