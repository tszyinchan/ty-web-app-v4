<div class="sheet-backdrop" (click)="cancel()"></div>
<div class="sheet" (click)="$event.stopPropagation()">
  <h2 class="sheet-title">New item</h2>
  <label class="dl-field">
    <span class="dl-field-label">Name</span>
    <input class="dl-field-input" [(ngModel)]="itemText" name="sheet_item_text" />
  </label>
  <div class="emoji-pick-row">
    <button type="button" class="emoji-trigger" (click)="openEmojiPicker()">
      {{ emoji || 'Add emoji' }}
    </button>
    @if (emoji) {
      <button
        type="button"
        class="dl-icon-btn"
        aria-label="Clear emoji"
        title="Clear emoji"
        (click)="clearEmoji()"
      >
        <app-daily-log-icon name="clear-emoji" />
      </button>
    }
  </div>
  <div class="colour-row">
    @for (preset of colourPresets; track preset.key) {
      <button
        type="button"
        class="colour-chip"
        [ngClass]="colourChipClasses(preset.key, colour === preset.key)"
        [attr.aria-label]="preset.label"
        (click)="selectColour(preset.key)"
      ></button>
    }
  </div>
  <label class="dl-field">
    <span class="dl-field-label">Remarks</span>
    <input class="dl-field-input" [(ngModel)]="remarks" name="sheet_item_remarks" />
  </label>
  <div class="sheet-actions">
    <button
      type="button"
      class="dl-icon-btn-fill"
      aria-label="Add"
      title="Add"
      [disabled]="busy() || !itemText.trim()"
      (click)="confirm()"
    >
      <app-daily-log-icon name="add" />
    </button>
    <button
      type="button"
      class="dl-icon-btn"
      aria-label="Cancel"
      title="Cancel"
      (click)="cancel()"
    >
      <app-daily-log-icon name="cancel" />
    </button>
  </div>
</div>

@if (showEmojiPicker()) {
  <div class="emoji-picker-backdrop" (click)="closeEmojiPicker()"></div>
  <div class="emoji-picker-panel">
    <emoji-picker (emoji-click)="onPickerEmoji($event)"></emoji-picker>
  </div>
}
