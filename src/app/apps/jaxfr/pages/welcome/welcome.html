<div class="welcome-container">
  <header class="welcome-header">
    <img src="logo.svg" alt="Jaxfr" class="brand-logo" />
    <p class="subtitle">
      {{ currentDate | date: "mediumDate" }}
      @if (userProfile(); as user) {
        · {{ user | tyDisplayName }}
      }
    </p>
    <p class="meta">App Version {{ appVersion() }} · {{ versionDate | date: "mediumDate" }}</p>
  </header>

  @if (loading()) {
    <div class="loading-wrap">
      <mat-spinner diameter="32"></mat-spinner>
    </div>
  } @else {
    <div class="launcher-grid">
      @for (tile of tiles(); track tile.route) {
        <a class="launcher-tile" [routerLink]="tile.route">
          <span class="launcher-icon">
            <mat-icon>{{ tile.icon }}</mat-icon>
          </span>
          <span>{{ tile.name }}</span>
        </a>
      }
    </div>
  }
</div>
