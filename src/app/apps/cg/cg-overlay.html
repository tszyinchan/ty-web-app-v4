<div class="overlay-root">
  <app-cg-stage>
    @for (layer of stagedLayers(); track layer.tb_tyapp_cgly_id) {
      <app-cg-layer-view
        [elementType]="layer.element_type"
        [layout]="layer.layout"
        [payload]="layer.payload"
        [visible]="layer.visible"
        [durationMs]="durationMs()"
        [sortOrder]="layer.sort_order"
        [mono]="look() === Mono"
      />
    }
  </app-cg-stage>
</div>
