<div class="overlay-root">
  <app-cg-stage>
    @if (output(); as live) {
      @for (layer of live.layers; track layer.tb_tyapp_cgly_id) {
        <app-cg-layer-view
          [elementType]="layer.element_type"
          [layout]="layer.layout"
          [payload]="layer.payload"
          [visible]="layer.visible"
        />
      }
    }
  </app-cg-stage>
</div>
